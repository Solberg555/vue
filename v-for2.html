<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MongoDBデータ一覧</title>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #747d83;
      color: white;
      font-size: 40px;
      padding: 12px 24px;
    }

    main {
      width: 80%;
      margin: 30px auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th {
      background: #343a40;
      color: white;
      text-align: left;
      padding: 14px;
    }

    td {
      padding: 14px;
      border-bottom: 1px solid #dddddd;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>
  <header>Vue3</header>

  <main id="app">
    <p>※データをテーブル表示する</p>

    <p v-if="errorMessage" class="error">
      {{ errorMessage }}
    </p>

    <table v-if="users.length">
      <thead>
        <tr>
          <th>Name</th>
          <th>mail</th>
          <th>tel</th>
        </tr>
      </thead>

      <tbody>
        <tr v-for="user in users" :key="user._id">
          <td>{{ user.name }}</td>
          <td>{{ user.mail }}</td>
          <td>{{ user.tel }}</td>
        </tr>
      </tbody>
    </table>
  </main>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          users: [],
          errorMessage: ''
        };
      },

      mounted() {
        axios
          .get('http://153.120.121.157:30002/notes_from_b')
          .then(response => {
            this.users = response.data;
          })
          .catch(error => {
            console.error(error);
            this.errorMessage = 'データを取得できませんでした';
          });
      }
    });

    app.mount('#app');
  </script>
</body>
</html>
